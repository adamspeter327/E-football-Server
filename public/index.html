<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Football Room Server</title>
  <style>
    body { background: #0b132b; color: #fff; font-family: sans-serif; padding: 20px; }
    .card { background: #1c2541; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    input { padding: 8px; width: 80%; margin-bottom: 10px; }
    button { padding: 10px 15px; background: #00e676; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Football Room Server Prototype</h1>
  <div class="card">
    <h2>Create Room</h2>
    <input type="text" id="roomName" placeholder="Room Name">
    <button onclick="createRoom()">Create Room</button>
    <p id="createdCode"></p>
  </div>
  <script>
    async function createRoom() {
      const name = document.getElementById('roomName').value;
      const res = await fetch('/api/rooms', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      const data = await res.json();
      if(data.ok) {
        document.getElementById('createdCode').innerText = 'Room Code: ' + data.room.code;
      }
    }
  </script>
</body>
</html>
